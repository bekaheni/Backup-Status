# HTTP-only vhost for first-time Certbot (before SSL cert exists)
# backup-d.bekat.co.uk — Backup Status dev dashboard

server {
    listen 80;
    listen [::]:80;
    server_name backup-d.bekat.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://unix:/run/backup-status-dev/backup-status.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
