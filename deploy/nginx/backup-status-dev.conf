# backup-d.bekat.co.uk — Backup Status dev dashboard
# Flask served via Unix socket /run/backup-status-dev/backup-status.sock

server {
    listen 80;
    listen [::]:80;
    server_name backup-d.bekat.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name backup-d.bekat.co.uk;

    ssl_certificate /etc/letsencrypt/live/backup-d.bekat.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backup-d.bekat.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 4m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://unix:/run/backup-status-dev/backup-status.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
