<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup Status Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #111;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            flex: 1;
        }
        .main-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .nav-left {
            display: flex;
            gap: 1rem;
        }
        .nav-buttons {
            display: flex;
            gap: 1rem;
        }
        .nav-btn {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s;
            min-width: 140px;
            text-align: center;
        }
        .nav-btn:hover {
            background: #00B8E6;
            color: var(--bg-primary);
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        .user-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        /* Header Section */
        .header {
            background: var(--bg-primary);
            padding: 1rem 0;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--accent-cyan);
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        .header-title-section {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .header-logo {
            height: 65px;
            width: auto;
            object-fit: contain;
        }
        
        .app-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0;
        }
        
        .nav-btn.active {
            background: var(--accent-cyan);
            color: var(--bg-primary);
        }
        
        .user-info {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="header-content">
            <div class="header-title-section">
                <img src="{{ url_for('static', filename='CoreSight.png') }}" alt="CoreSight Logo" class="header-logo">
                <h1 class="app-title">Configuration</h1>
            </div>
            <nav class="main-nav">
                <div class="nav-left">
                    <a href="/" class="nav-btn">Server Status</a>
                    <a href="/nas" class="nav-btn">NAS Status</a>
                    <a href="/configuration" class="nav-btn active">Configuration</a>
                    <a href="/manual-refresh" class="nav-btn refresh-btn">
                        <i class="fas fa-sync-alt"></i> Refresh Data
                    </a>
                </div>
                <div class="nav-right">
                    <div class="user-controls">
                        {% if current_user.is_authenticated %}
                            <span class="user-info">Welcome, {{ current_user.username }}</span>
                            <a href="{{ url_for('logout') }}" class="nav-btn logout-btn">Logout</a>
                        {% endif %}
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
